name: Daily data pull

on:
  schedule:
    # 08:00 UTC = 4:00am US Eastern during EDT (Mar-Nov).
    # During EST (Nov-Mar) this runs at 3:00am ET instead - cron has no DST awareness.
    # Note: GitHub Actions `schedule` is best-effort and commonly fires late by
    # minutes to hours - this sets the target, not a guaranteed start time.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with vmatx-forecast.yml so the two scheduled jobs never push at the
# same time. cancel-in-progress: false queues the later run instead of
# killing it - a dropped data pull would leave a gap in the CSVs.
concurrency:
  group: munidata-commits
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: |
          echo "START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "START_HUMAN=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
          echo "Run started: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch VMATX / FTMA daily EOD
        run: python src/fetch-VMATX_yf.py

      - name: Fetch FRED rate series
        run: python src/fetch_DFF.py --years 30

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "Daily data pull: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - name: Print run timing
        if: always()
        run: |
          end_epoch=$(date -u +%s)
          end_human=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          elapsed=$((end_epoch - START_EPOCH))
          printf "Run started:  %s\n" "$START_HUMAN"
          printf "Run finished: %s\n" "$end_human"
          printf "Duration:     %02d:%02d:%02d (%ss)\n" \
            $((elapsed/3600)) $((elapsed%3600/60)) $((elapsed%60)) "$elapsed"
